<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- csp -->
<title>Claude Context</title>
<!-- panel.css -->
</head>
<body>
<header>
  <h1><span class="kx-n" data-testid="count" aria-live="polite">0</span> live Claude sessions</h1>
  <span class="kx-showing" data-testid="showing" hidden></span>
  <span class="kx-counter kx-zone-counts" data-testid="zones"></span>
  <span class="kx-counter kx-start-median" data-testid="start-median" hidden><b></b> start</span>
  <span class="kx-counter kx-abandoned" data-testid="abandoned-count" hidden title="A closed VS Code chat tab keeps its process running until Developer: Reload Window or VS Code quits, and the panel cannot tell a closed tab from an open one, so some of these are probably closed tabs"><b></b> idle over an hour</span>
  <span class="kx-counter kx-cache-counts" data-testid="cache-counts" title="Prompt cache: how many of the listed sessions have a warm cache now, and how many went cold"><span><b data-testid="cache-warm">0</b> warm</span><span><b data-testid="cache-cold">0</b> cold</span></span>
  <div class="kx-tools">
    <span class="kx-refreshed" data-testid="refreshed" role="status" hidden></span>
    <button type="button" class="kx-toggle" data-testid="compact" aria-pressed="false" aria-label="Compact rows"></button>
    <button type="button" class="kx-refresh" data-testid="refresh" aria-label="Refresh" title="Read the registry and every transcript again now"></button>
  </div>
  <div class="kx-zscale" data-testid="zone-scale" role="img"></div>
</header>
<div class="kx-controls" data-testid="controls">
  <div class="kx-scope" data-testid="scope">
    <span class="kx-seg" role="group" aria-label="Sessions from" data-testid="scope-switch">
      <button type="button" data-testid="scope-workspace" aria-pressed="true" title="The sessions started inside the workspace folders">This workspace</button>
      <button type="button" data-testid="scope-all" aria-pressed="false" title="Every live Claude session on this machine, grouped by project">All projects</button>
    </span>
    <span class="kx-scope-name" data-testid="scope-name" hidden></span>
    <button type="button" class="kx-scope-more" data-testid="scope-more" title="Show every project" hidden></button>
  </div>
  <label>Sort
    <select data-testid="sort" aria-label="Sort the sessions in each group">
      <option value="last">last turn</option>
      <option value="size">context size</option>
      <option value="cold">time until cold</option>
      <option value="started">started</option>
      <option value="title">title</option>
    </select>
  </label>
  <button type="button" class="kx-chip" data-testid="filter-hot" aria-pressed="false" title="Show only the sessions in the orange and red zones">orange and red only</button>
  <span class="kx-models" data-testid="models" role="group" aria-label="Models shown"></span>
  <button type="button" class="kx-reset" data-testid="reset" hidden>reset</button>
</div>
<div data-testid="errors" role="status" hidden></div>
<main data-testid="list"></main>
<section class="kx-detail" data-testid="detail" aria-label="Session details" hidden></section>

<!-- panel.js -->
</body>
</html>
