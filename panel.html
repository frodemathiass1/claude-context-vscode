<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- csp -->
<title>Claude Context</title>
<style nonce="{{nonce}}">
  /* Own variables; in VS Code they are set from --vscode-* (light/dark follows the editor). A host that
     serves this file in a browser can set them from its own tokens in a style appended to head. No
     external CSS here, no theme button. Classes carry the kx- prefix so they never collide with a host
     page's own classes. */
  :root {
    --kx-bg: var(--vscode-sideBar-background, #ffffff);
    --kx-fg: var(--vscode-foreground, #1f2328);
    --kx-muted: var(--vscode-descriptionForeground, #6e7781);
    --kx-border: var(--vscode-sideBarSectionHeader-border, var(--vscode-widget-border, rgba(128, 128, 128, 0.25)));
    --kx-border-strong: var(--vscode-editorWidget-border, rgba(128, 128, 128, 0.45)); /* reserved for hover and busy accents */
    --kx-row-hover: var(--vscode-list-hoverBackground, rgba(128, 128, 128, 0.08));
    /* the zone colours for text (the count, the legend numbers) … */
    --kx-green: var(--vscode-charts-green, #1a7f37);
    --kx-yellow: var(--vscode-charts-yellow, #9a6700);
    /* not --vscode-charts-orange: VS Code derives it from editor.findMatchHighlightBackground (#EA5C0055),
       a third-opaque orange that reads brown over a dark side bar. Halfway between the theme's yellow and red instead. */
    --kx-orange: color-mix(in srgb, var(--kx-yellow) 50%, var(--kx-red));
    --kx-red: var(--vscode-charts-red, #cf222e);
    /* … and for fills (dot, context bar, curve, meter segments), so a host can pick a palette per use.
       Every zone in ZONES below has a pair --kx-<zone> / --kx-<zone>-fill; adding a zone adds a pair here. */
    --kx-green-fill: var(--vscode-charts-green, var(--kx-green));
    --kx-yellow-fill: var(--vscode-charts-yellow, var(--kx-yellow));
    --kx-orange-fill: color-mix(in srgb, var(--kx-yellow-fill) 50%, var(--kx-red-fill));
    --kx-red-fill: var(--vscode-charts-red, var(--kx-red));
    --kx-blue: var(--vscode-charts-blue, #0969da); /* reserved for busy accents */
    --kx-grid: var(--vscode-charts-lines, color-mix(in srgb, var(--kx-muted) 55%, transparent)); /* limit lines, marks */
    --kx-track: color-mix(in srgb, var(--kx-fg) 10%, transparent); /* the track behind the bar and the meter */
    --kx-badge-bg: var(--vscode-badge-background, var(--vscode-focusBorder, #0969da));
    --kx-badge-fg: var(--vscode-badge-foreground, #ffffff);
    --kx-heading: var(--vscode-sideBarSectionHeader-foreground, var(--kx-muted));
    --kx-accent: var(--vscode-focusBorder, #0969da);
    --kx-surface: var(--vscode-editorWidget-background, #f6f8fa); /* the field behind the detail view's curve */
    --kx-font: var(--vscode-font-family, system-ui, sans-serif);
    --kx-font-size: var(--vscode-font-size, 13px);
    --kx-mono: var(--vscode-editor-font-family, ui-monospace, "SF Mono", Menlo, Consolas, monospace);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--kx-bg); color: var(--kx-fg);
    font-family: var(--kx-font); font-size: var(--kx-font-size); line-height: 1.4;
    container-type: inline-size; /* the layout below follows the panel's width, not the window's */
  }

  /* ── Header: the count, the zone meter and the scope ── */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 10px 12px; border-bottom: 1px solid var(--kx-border);
  }
  header h1 { margin: 0; font-size: 1em; font-weight: 600; display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  header h1 .kx-n { font-family: var(--kx-mono); font-size: 1.35em; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  /* the scope, the "updated 12:04:31" note and the refresh button, pushed to the right end of the header */
  .kx-tools { display: inline-flex; align-items: center; gap: 10px; margin-left: auto; }
  header label { display: inline-flex; align-items: center; gap: 6px; color: var(--kx-muted); cursor: pointer; white-space: nowrap; font-size: 0.92em; }
  header input { accent-color: var(--kx-accent); margin: 0; width: 14px; height: 14px; }
  .kx-refreshed { font-size: 0.82em; color: var(--kx-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .kx-refresh {
    display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; padding: 0; margin: 0;
    border: 1px solid transparent; border-radius: 4px; background: transparent; color: var(--kx-muted); cursor: pointer;
  }
  .kx-refresh:hover { background: var(--kx-row-hover); color: var(--kx-fg); }
  .kx-refresh:focus-visible { outline: 1px solid var(--kx-accent); outline-offset: 1px; }
  .kx-refresh svg { width: 14px; height: 14px; }
  .kx-refresh[aria-busy="true"] svg { animation: kx-spin 0.8s linear infinite; } /* spins until the next list arrives */
  @keyframes kx-spin { to { transform: rotate(360deg); } }
  /* one segment per zone, width = that zone's share of the sessions with a known zone; the legend repeats the numbers */
  .kx-meter { flex: 1 1 160px; min-width: 140px; display: flex; flex-direction: column; gap: 4px; }
  .kx-meter-bar { display: flex; height: 6px; border-radius: 3px; overflow: hidden; background: var(--kx-track); }
  .kx-meter-bar span { display: block; height: 100%; background: var(--kx-zone-fill, var(--kx-muted)); }
  .kx-meter-leg { display: flex; font-size: 0.82em; font-variant-numeric: tabular-nums; color: var(--kx-muted); white-space: nowrap; }
  .kx-meter-leg span + span::before { content: "·"; margin: 0 6px; }
  .kx-meter-leg b { font-weight: 600; color: var(--kx-zone-text, inherit); }
  /* the prompt-cache counters: warm and cold, beside the zone legend */
  .kx-cache-counts { font-size: 0.82em; font-variant-numeric: tabular-nums; color: var(--kx-muted); white-space: nowrap; display: inline-flex; align-items: center; }
  .kx-cache-counts b { font-weight: 600; color: var(--kx-fg); }
  .kx-cache-counts span + span::before { content: "·"; margin: 0 6px; }
  /* the median start cost of the sessions that began fresh, beside the cache counters */
  .kx-start-median { font-size: 0.82em; font-variant-numeric: tabular-nums; color: var(--kx-muted); white-space: nowrap; }
  .kx-start-median b { font-weight: 600; color: var(--kx-fg); }
  /* how many sessions sit in the folded "Idle over an hour" group: processes left running, most likely closed tabs */
  .kx-abandoned { font-size: 0.82em; font-variant-numeric: tabular-nums; color: var(--kx-muted); white-space: nowrap; }
  .kx-abandoned b { font-weight: 600; color: var(--kx-fg); }

  /* "showing 4 of 10" beside the count while a filter hides sessions */
  .kx-showing { font-size: 0.82em; color: var(--kx-muted); white-space: nowrap; }

  /* ── Controls: the sort and the filters, under the header; wraps to more lines in the narrow layout ── */
  .kx-controls {
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 6px 12px;
    border-bottom: 1px solid var(--kx-border); font-size: 0.86em; color: var(--kx-muted);
  }
  .kx-controls label { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .kx-controls select {
    font: inherit; color: var(--kx-fg); background: var(--kx-bg); border: 1px solid var(--kx-border-strong);
    border-radius: 4px; padding: 1px 4px; max-width: 160px;
  }
  .kx-chip {
    font: inherit; display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 10px;
    border: 1px solid var(--kx-border-strong); background: transparent; color: var(--kx-muted); cursor: pointer; white-space: nowrap;
  }
  .kx-chip:hover { color: var(--kx-fg); }
  .kx-chip[aria-pressed="true"] { background: var(--kx-badge-bg); color: var(--kx-badge-fg); border-color: transparent; }
  .kx-chip:focus-visible, .kx-controls select:focus-visible, .kx-reset:focus-visible { outline: 1px solid var(--kx-accent); outline-offset: 1px; }
  .kx-models { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .kx-reset { font: inherit; background: none; border: 0; padding: 0; color: var(--kx-accent); cursor: pointer; text-decoration: underline; }
  .kx-hidden-all { padding: 6px 4px 10px; color: var(--kx-muted); font-style: italic; font-size: 0.9em; }

  main { padding: 8px 12px 14px; }
  .kx-message { padding: 18px 4px; color: var(--kx-muted); text-align: center; }
  .kx-error { padding: 8px 12px; color: var(--kx-red); border-bottom: 1px solid var(--kx-border); font-size: 0.92em; }
  .kx-contact { display: flex; align-items: center; gap: 10px; }
  .kx-contact button {
    font: inherit; font-size: 0.92em; color: var(--kx-fg); background: transparent;
    border: 1px solid var(--kx-border); border-radius: 4px; padding: 2px 8px; cursor: pointer;
  }
  .kx-contact button:hover { background: var(--kx-row-hover); }

  /* ── Groups: "Working now · n", "Idle · n" and, with all projects, the project above them ── */
  .kx-group {
    margin: 10px 0 4px; font-size: 0.78em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--kx-heading); display: flex; align-items: center; gap: 6px;
  }
  .kx-group svg { width: 12px; height: 12px; }
  .kx-group .kx-gn { font-weight: 500; letter-spacing: 0; text-transform: none; color: var(--kx-muted); }
  .kx-group::after { content: ""; flex: 1; height: 1px; background: var(--kx-border); }
  .kx-group.kx-project { margin-top: 16px; }
  /* the whole heading is the fold button; the chevron points right when folded, down when open */
  .kx-group .kx-fold {
    display: inline-flex; align-items: center; gap: 6px; padding: 1px 4px 1px 0; margin: 0 0 0 -2px; border: 0; border-radius: 4px;
    background: transparent; font: inherit; text-transform: inherit; letter-spacing: inherit; color: inherit; cursor: pointer;
  }
  .kx-group .kx-fold:hover { color: var(--kx-fg); }
  .kx-group .kx-fold:focus-visible { outline: 1px solid var(--kx-accent); outline-offset: 1px; }
  .kx-group .kx-chev { transition: transform 0.15s ease; }
  .kx-group .kx-fold[aria-expanded="true"] .kx-chev { transform: rotate(90deg); }
  .kx-ico { width: 13px; height: 13px; flex: none; vertical-align: -2px; }

  /* ── Row: stacked under 620 px (title row, bar, curve, meta), four columns from 620 px ── */
  .kx-session {
    display: grid; grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas: "title num" "bar bar" "curve curve" "meta meta";
    gap: 3px 10px; padding: 8px 4px; border-bottom: 1px solid var(--kx-border); align-items: center;
  }
  .kx-session:last-child { border-bottom: none; }
  .kx-session:hover { background: var(--kx-row-hover); }
  .kx-session.kx-dimmed { opacity: 0.72; } /* 0.5 took the red count below 3:1 on a light surface */
  .kx-row-title { grid-area: title; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .kx-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .kx-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--kx-zone-fill, var(--kx-muted)); position: relative; flex: none; }
  /* the dot pulses while the session is busy: a ring in the dot's own colour grows and fades */
  .kx-dot.kx-pulse::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%; background: inherit;
    animation: kx-pulse 1.6s ease-out infinite;
  }
  @keyframes kx-pulse { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.6); opacity: 0; } }
  .kx-badge {
    display: inline-flex; align-items: center; gap: 3px; padding: 0 6px; border-radius: 9px;
    font-size: 0.78em; font-weight: 600; line-height: 1.6; background: var(--kx-badge-bg); color: var(--kx-badge-fg); flex: none;
  }
  .kx-badge svg { width: 10px; height: 10px; }
  /* the count in the zone's text colour, the zone name under it */
  .kx-count { grid-area: num; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .kx-num {
    font-family: var(--kx-mono); font-variant-numeric: tabular-nums; font-weight: 700; line-height: 1; white-space: nowrap;
    font-size: 1.25em; color: var(--kx-zone-text, var(--kx-muted));
  }
  .kx-num[data-zone="unknown"] { font-family: inherit; font-size: 1em; font-weight: 500; }
  /* a title the transcript did not give: "new session" and the registry's name, muted so it is not read as a message */
  .kx-title[data-fallback], .kx-d-head h1[data-fallback] { color: var(--kx-muted); font-weight: 500; }
  .kx-zone-txt { font-size: 0.78em; line-height: 1; color: var(--kx-muted); }
  /* the context bar: a track scaled 0–200K, the fill in the zone's fill colour, a gap at every limit */
  .kx-bar-col { grid-area: bar; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .kx-bar { position: relative; height: 10px; border-radius: 5px; background: var(--kx-track); overflow: hidden; }
  .kx-fill {
    position: absolute; inset: 0 auto 0 0; width: calc(var(--p) * 1%); border-radius: 5px;
    background: var(--kx-zone-fill, var(--kx-muted)); transition: width 0.5s ease; overflow: hidden;
  }
  /* the segment's fixed load (its first turn) as a muted shade at the start of the fill; the rest is the conversation */
  .kx-base { position: absolute; inset: 0 auto 0 0; width: calc(var(--b) * 1%); background: color-mix(in srgb, var(--kx-zone-fill, var(--kx-muted)) 45%, var(--kx-bg)); }
  /* a slow sheen moves over the fill while the session is busy */
  .kx-fill.kx-busy::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0, rgba(255, 255, 255, 0.35) 50%, transparent 100%) no-repeat;
    background-size: 120px 100%; animation: kx-sheen 1.8s linear infinite;
  }
  @keyframes kx-sheen { from { background-position: -120px 0; } to { background-position: 120px 0; } }
  .kx-tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--kx-bg); left: calc(var(--t) * 1%); }
  .kx-over { position: absolute; right: 0; top: 0; bottom: 0; width: 14px; background: repeating-linear-gradient(135deg, transparent 0 3px, var(--kx-bg) 3px 5px); }
  /* under the bar: the top sources of the conversation's growth, an estimate */
  .kx-growth { font-size: 0.8em; color: var(--kx-muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* the sparkline fills its column; strokes stay 1 px although the viewBox is stretched */
  .kx-curve-wrap { grid-area: curve; min-width: 0; }
  .kx-curve { display: block; width: 100%; height: 18px; overflow: visible; color: var(--kx-zone-fill, var(--kx-muted)); }
  .kx-limit { stroke: var(--kx-grid); stroke-width: 1; stroke-dasharray: 3 3; }
  .kx-area { fill: currentColor; opacity: 0.18; stroke: none; }
  .kx-line { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
  /* a compaction (read from the transcript) is a solid mark; a dip (a guessed drop) is dotted */
  .kx-compact { stroke: var(--kx-fg); stroke-width: 1.5; opacity: 0.85; }
  .kx-dip { stroke: var(--kx-fg); stroke-width: 1; opacity: 0.7; stroke-dasharray: 2 2; }
  .kx-nocurve { font-size: 0.82em; color: var(--kx-muted); font-style: italic; }
  /* output per turn under the curve, on its own scale: the whole bar faint, the thinking part of it stronger */
  .kx-out { display: block; width: 100%; height: 7px; margin-top: 2px; color: var(--kx-muted); }
  .kx-out-all { fill: currentColor; opacity: 0.35; }
  .kx-out-think { fill: currentColor; opacity: 0.8; }
  .kx-meta { grid-area: meta; display: flex; flex-wrap: wrap; gap: 3px 10px; color: var(--kx-muted); font-size: 0.86em; min-width: 0; }
  .kx-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .kx-meta svg { width: 12px; height: 12px; opacity: 0.8; }
  /* the prompt cache: "warm · 47 min" with the TTL as a small outlined pill; a few minutes from cold the
     text turns orange, so the user can send a turn before the deadline; cold is plain */
  .kx-cache[data-cache="soon"] { color: var(--kx-orange); font-weight: 600; }
  .kx-cache[data-cache="soon"] svg { opacity: 1; }
  .kx-cache[data-cache="cold"] { color: var(--kx-fg); }
  .kx-ttl {
    font-size: 0.82em; font-weight: 600; line-height: 1.4; padding: 0 4px; border-radius: 4px;
    border: 1px solid var(--kx-border-strong); color: var(--kx-muted); font-variant-numeric: tabular-nums;
  }
  .kx-ttl[data-ttl="5m"] { color: var(--kx-orange); border-color: currentColor; } /* a drop from 1h is the thing to notice */
  /* the axis line above each group: column names and the marks of the bar; only in the wide layout */
  .kx-axis { display: none; }
  /* the whole row opens the session's detail view */
  .kx-session[tabindex] { cursor: pointer; }
  .kx-session[tabindex]:focus-visible { outline: 1px solid var(--kx-accent); outline-offset: -1px; }

  /* ── Detail view of one session: replaces the header, the controls and the list. Top bar, header, meta
     line, the large curve with output bars under it, the facts tables; stacked under 620 px ── */
  .kx-detail { padding: 8px 12px 16px; }
  .kx-d-top { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
  .kx-d-back {
    display: inline-flex; align-items: center; gap: 4px; font: inherit; font-size: 0.92em; color: var(--kx-muted);
    background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 8px 2px 4px; cursor: pointer;
  }
  .kx-d-back:hover { background: var(--kx-row-hover); color: var(--kx-fg); }
  .kx-d-back:focus-visible, .kx-d-copy:focus-visible, .kx-d-turn:focus-visible { outline: 1px solid var(--kx-accent); outline-offset: 1px; }
  .kx-d-back svg { width: 14px; height: 14px; }
  .kx-d-esc { margin-left: auto; font-size: 0.78em; color: var(--kx-muted); font-family: var(--kx-mono); }
  .kx-d-head { display: flex; align-items: center; gap: 8px; min-width: 0; margin: 4px 0 2px; }
  .kx-d-head h1 { margin: 0; font-size: 1.15em; font-weight: 600; line-height: 1.3; min-width: 0; overflow-wrap: anywhere; }
  .kx-d-head .kx-dot { width: 12px; height: 12px; }
  .kx-d-count { margin-left: auto; }
  .kx-d-head .kx-num { font-size: 1.6em; }
  .kx-d-zone { font-size: 0.78em; color: var(--kx-muted); text-align: right; }
  .kx-d-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; color: var(--kx-muted); font-size: 0.86em; margin: 0 0 8px; }
  .kx-d-meta span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; min-width: 0; }
  .kx-d-meta svg { width: 12px; height: 12px; opacity: 0.8; }
  .kx-d-sec { margin: 0 0 12px; }
  /* the curve: a field with the zone bands, the axis at the right edge, a hairline and a tooltip per turn */
  .kx-d-field { position: relative; height: 150px; border: 1px solid var(--kx-border); border-radius: 6px; background: var(--kx-surface); overflow: hidden; }
  .kx-d-curve { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; color: var(--kx-zone-fill, var(--kx-muted)); }
  .kx-d-band { fill: var(--kx-band, transparent); opacity: 0.09; }
  .kx-d-axis {
    position: absolute; right: 4px; font-size: 0.7em; color: var(--kx-muted); font-variant-numeric: tabular-nums; line-height: 1;
    transform: translateY(-50%); pointer-events: none; background: color-mix(in srgb, var(--kx-surface) 80%, transparent); padding: 0 2px; border-radius: 2px;
  }
  .kx-d-field[data-axis="2"] .kx-d-axis-mid, .kx-d-field[data-axis="1"] .kx-d-axis-mid, .kx-d-field[data-axis="1"] .kx-d-axis-low { display: none; }
  .kx-d-hair { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--kx-fg); opacity: 0.6; pointer-events: none; display: none; }
  .kx-d-tip {
    position: absolute; top: 40px; max-width: min(260px, 80%); background: var(--kx-bg); border: 1px solid var(--kx-border-strong);
    border-radius: 4px; padding: 4px 8px; font-size: 0.8em; line-height: 1.35; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18); pointer-events: none; display: none;
  }
  .kx-d-tip b { font-family: var(--kx-mono); font-variant-numeric: tabular-nums; }
  .kx-d-field.kx-d-hover .kx-d-hair, .kx-d-field.kx-d-hover .kx-d-tip { display: block; }
  /* the compaction's label on its own row under the top axis label, the segment's start at the bottom */
  .kx-d-mark {
    position: absolute; top: 22px; font-size: 0.7em; color: var(--kx-fg); background: var(--kx-bg); border: 1px solid var(--kx-border-strong);
    border-radius: 3px; padding: 0 4px; white-space: nowrap; transform: translateX(-50%); pointer-events: none; max-width: 45%; overflow: hidden; text-overflow: ellipsis;
  }
  .kx-d-mark.kx-d-start { top: auto; bottom: 4px; color: var(--kx-muted); }
  .kx-d-lbl { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 0.8em; color: var(--kx-muted); margin: 0 0 4px; }
  .kx-d-leg { display: inline-flex; align-items: center; gap: 4px; }
  .kx-d-leg i { display: inline-block; width: 12px; height: 0; border-top: 2px solid var(--kx-fg); }
  .kx-d-leg i.kx-d-dash { border-top-style: dashed; border-top-width: 1px; border-color: var(--kx-grid); }
  /* the turn chooser: the keyboard's way to the same tooltip */
  .kx-d-turn-row { display: flex; align-items: center; gap: 8px; margin: 6px 0 0; font-size: 0.82em; color: var(--kx-muted); }
  .kx-d-turn { flex: 1 1 auto; min-width: 0; accent-color: var(--kx-accent); margin: 0; height: 18px; }
  .kx-d-turn-val { font-family: var(--kx-mono); font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 9ch; text-align: right; }
  .kx-d-out { display: block; width: 100%; height: 28px; margin-top: 4px; color: var(--kx-muted); }
  /* one sentence of facts over the curve, edged and tinted in the zone colour */
  .kx-d-sum {
    margin: 0 0 10px; padding: 8px 10px; border-left: 3px solid var(--kx-zone-fill, var(--kx-muted)); border-radius: 0 4px 4px 0;
    background: color-mix(in srgb, var(--kx-zone-fill, var(--kx-muted)) 8%, transparent); font-size: 0.95em; font-weight: 600;
  }
  /* where the context went: name · bar · tokens · share per source, the bars scaled to the largest; the caveat once under them */
  .kx-d-bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: center; font-size: 0.9em; font-variant-numeric: tabular-nums; }
  .kx-d-bar { height: 10px; border-radius: 5px; background: var(--kx-track); overflow: hidden; }
  .kx-d-bar i { display: block; height: 100%; width: calc(var(--p) * 1%); background: var(--kx-zone-fill, var(--kx-muted)); border-radius: 5px; }
  .kx-d-bar-n { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 16ch; } /* a long MCP name must not squeeze the bars */
  .kx-d-bar-v { font-family: var(--kx-mono); white-space: nowrap; }
  .kx-d-bar-s { color: var(--kx-muted); white-space: nowrap; min-width: 4ch; text-align: right; }
  .kx-d-note { margin: 6px 0 0; font-size: 0.8em; color: var(--kx-muted); font-style: italic; }
  /* the facts: two tables, key over value in the narrow layout so a long path never overflows */
  .kx-d-facts { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px 20px; }
  .kx-d-facts table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 0.9em; }
  .kx-d-facts caption { text-align: left; font-size: 0.78em; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--kx-heading); padding: 0 0 4px; }
  .kx-d-facts tr { display: block; padding: 4px 0; border-bottom: 1px solid var(--kx-border); }
  .kx-d-facts th, .kx-d-facts td { display: block; text-align: left; padding: 0; border: 0; vertical-align: top; overflow-wrap: anywhere; }
  .kx-d-facts th { font-weight: 500; font-size: 0.86em; color: var(--kx-muted); }
  .kx-d-facts td { font-variant-numeric: tabular-nums; }
  .kx-d-facts td code { font-family: var(--kx-mono); font-size: 0.9em; overflow-wrap: anywhere; }
  .kx-d-copy {
    font: inherit; font-size: 0.8em; color: var(--kx-muted); background: transparent; border: 1px solid var(--kx-border-strong);
    border-radius: 4px; padding: 0 6px; margin-left: 6px; cursor: pointer; vertical-align: 1px;
  }
  .kx-d-copy:hover { color: var(--kx-fg); background: var(--kx-row-hover); }
  .kx-d-copy[data-done] { color: var(--kx-green); border-color: currentColor; }

  @container (min-width: 620px) {
    .kx-session {
      grid-template-columns: minmax(0, 1.2fr) minmax(160px, 1fr) minmax(140px, 0.8fr) minmax(72px, auto);
      grid-template-areas: "title bar curve num" "meta bar curve num";
      gap: 2px 14px; padding: 8px 6px;
    }
    .kx-num { font-size: 1.45em; }
    .kx-curve { height: 26px; }
    .kx-out { height: 9px; }
    .kx-axis {
      display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(160px, 1fr) minmax(140px, 0.8fr) minmax(72px, auto);
      gap: 0 14px; padding: 2px 6px 4px; font-size: 0.74em; color: var(--kx-muted); text-transform: uppercase; letter-spacing: 0.05em;
    }
    .kx-axis .kx-scale { position: relative; height: 1em; }
    .kx-axis .kx-scale span { position: absolute; top: 0; transform: translateX(-50%); left: calc(var(--t) * 1%); font-variant-numeric: tabular-nums; }
    .kx-axis .kx-scale span:first-child { transform: none; }
    .kx-axis .kx-scale span:last-child { transform: translateX(-100%); }
    .kx-axis .kx-r { text-align: right; }
    .kx-detail { padding: 10px 16px 20px; }
    .kx-d-head h1 { font-size: 1.35em; }
    .kx-d-head .kx-num { font-size: 2em; }
    .kx-d-field { height: 220px; }
    .kx-d-field[data-axis] .kx-d-axis { display: block; }
    .kx-d-field[data-axis-wide="2"] .kx-d-axis-mid, .kx-d-field[data-axis-wide="1"] .kx-d-axis-mid, .kx-d-field[data-axis-wide="1"] .kx-d-axis-low { display: none; }
    .kx-d-out { height: 40px; }
    .kx-d-pair { display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 0 20px; align-items: start; } /* the curve and where the context went */
    .kx-d-facts { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .kx-d-facts tr { display: table-row; padding: 0; border: 0; }
    .kx-d-facts th, .kx-d-facts td { display: table-cell; padding: 3px 6px 3px 0; border-bottom: 1px solid var(--kx-border); }
    .kx-d-facts th { width: 42%; font-size: 1em; }
  }
  /* with five marks the labels need about 240 px; until the bar column is that wide (a container of about
     880 px), every second label drops to a second row so neighbours never overlap */
  @container (min-width: 620px) and (max-width: 879px) {
    .kx-axis .kx-scale { height: 2em; }
    .kx-axis .kx-scale span:nth-child(even) { top: 1em; }
  }

  @media (prefers-reduced-motion: reduce) {
    .kx-dot.kx-pulse::after, .kx-fill.kx-busy::after, .kx-refresh[aria-busy="true"] svg { animation: none; }
    .kx-fill, .kx-group .kx-chev { transition: none; }
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1><span class="kx-n" data-testid="count" aria-live="polite">0</span> live Claude sessions</h1>
  <span class="kx-showing" data-testid="showing" hidden></span>
  <div class="kx-meter" data-testid="zones">
    <div class="kx-meter-bar" role="img" aria-label="no sessions"></div>
    <div class="kx-meter-leg"></div>
  </div>
  <span class="kx-start-median" data-testid="start-median" hidden><b></b> start</span>
  <span class="kx-abandoned" data-testid="abandoned-count" hidden title="Sessions without a turn for more than an hour. A closed chat tab keeps its process running until Developer: Reload Window or VS Code quits, and the panel cannot tell a closed tab from an open one, so some of these are probably closed tabs"><b></b> idle over an hour</span>
  <span class="kx-cache-counts" data-testid="cache-counts" title="Prompt cache: how many of the listed sessions have a warm cache now, and how many went cold"><span><b data-testid="cache-warm">0</b> warm</span><span><b data-testid="cache-cold">0</b> cold</span></span>
  <div class="kx-tools">
    <label><input type="checkbox" data-testid="all"> All projects</label>
    <span class="kx-refreshed" data-testid="refreshed" role="status" hidden></span>
    <button type="button" class="kx-refresh" data-testid="refresh" aria-label="Refresh" title="Read the registry and every transcript again now"></button>
  </div>
</header>
<div class="kx-controls" data-testid="controls">
  <label>Sort
    <select data-testid="sort" aria-label="Sort the sessions in each group">
      <option value="last">last turn</option>
      <option value="size">context size</option>
      <option value="cold">time until cold</option>
      <option value="started">started</option>
      <option value="title">title</option>
    </select>
  </label>
  <button type="button" class="kx-chip" data-testid="filter-hot" aria-pressed="false" title="Show only the sessions in the orange and red zones">orange and red only</button>
  <span class="kx-models" data-testid="models" role="group" aria-label="Models shown"></span>
  <button type="button" class="kx-reset" data-testid="reset" hidden>reset</button>
</div>
<div class="kx-error kx-contact" data-testid="contact" hidden>
  <span>Lost contact with the dev server.</span>
  <button type="button">Try again</button>
</div>
<div data-testid="errors" hidden></div>
<main data-testid="list"></main>
<section class="kx-detail" data-testid="detail" aria-label="Session details" hidden></section>

<script nonce="{{nonce}}">
(function () {
  "use strict";
  const countEl = document.querySelector('[data-testid="count"]');
  const allEl = document.querySelector('[data-testid="all"]');
  const errorsEl = document.querySelector('[data-testid="errors"]');
  const contactEl = document.querySelector('[data-testid="contact"]');
  const listEl = document.querySelector('[data-testid="list"]');
  const meterBarEl = document.querySelector(".kx-meter-bar");
  const meterLegEl = document.querySelector(".kx-meter-leg");
  const cacheWarmEl = document.querySelector('[data-testid="cache-warm"]');
  const cacheColdEl = document.querySelector('[data-testid="cache-cold"]');
  const startMedianEl = document.querySelector('[data-testid="start-median"]');
  const abandonedEl = document.querySelector('[data-testid="abandoned-count"]');
  const refreshEl = document.querySelector('[data-testid="refresh"]');
  const refreshedEl = document.querySelector('[data-testid="refreshed"]');
  const showingEl = document.querySelector('[data-testid="showing"]');
  const sortEl = document.querySelector('[data-testid="sort"]');
  const hotEl = document.querySelector('[data-testid="filter-hot"]');
  const modelsEl = document.querySelector('[data-testid="models"]');
  const resetEl = document.querySelector('[data-testid="reset"]');
  const headerEl = document.querySelector("header");
  const controlsEl = document.querySelector('[data-testid="controls"]');
  const detailEl = document.querySelector('[data-testid="detail"]');
  // the VS Code webview API when the panel runs in VS Code; null when a dev server hosts this file (the adapter at the end)
  const vscode = typeof acquireVsCodeApi === "function" ? acquireVsCodeApi() : null;

  // ── Remembered choices (the folded groups): the webview's state in VS Code, localStorage in a browser ──
  const store = {
    get(key) {
      try { return vscode ? (vscode.getState() || {})[key] : JSON.parse(localStorage.getItem(`kx-${key}`)); } catch { return undefined; }
    },
    set(key, value) {
      try { if (vscode) vscode.setState({ ...(vscode.getState() || {}), [key]: value }); else localStorage.setItem(`kx-${key}`, JSON.stringify(value)); } catch { /* no storage: the choice lasts this render */ }
    },
  };
  // group keys: "busy", "idle" and "abandoned" fold that group in every project; "project:<name>" folds a whole project.
  // A group in FOLDED_FIRST starts folded, so `unfolded` remembers the opposite choice for it.
  const FOLDED_FIRST = ["abandoned"];
  const keys = (name) => new Set(Array.isArray(store.get(name)) ? store.get(name).filter((k) => typeof k === "string") : []);
  const folded = keys("folded"), unfolded = keys("unfolded");
  const isFolded = (key) => (FOLDED_FIRST.includes(key) ? !unfolded.has(key) : folded.has(key));
  function toggleFold(key) {
    const set = FOLDED_FIRST.includes(key) ? unfolded : folded;
    if (set.has(key)) set.delete(key); else set.add(key);
    store.set(set === folded ? "folded" : "unfolded", [...set]);
  }
  let lastData = null; // the last list rendered, drawn again when a group is folded or unfolded, or the view changes

  // ── The view: the sort and the filters, remembered like the folds. The sort orders the rows inside each
  // group (busy stays first); the filters apply to the idle groups only, a busy session is never hidden.
  // hiddenModels holds short model names the user switched off; a model that leaves the list takes its choice with it. ──
  const SORTS = ["last", "size", "cold", "started", "title"];
  const VIEW_DEFAULT = { sort: "last", hotOnly: false, hiddenModels: [] };
  function loadView() {
    const v = store.get("view");
    const o = v && typeof v === "object" ? v : {};
    return {
      sort: SORTS.includes(o.sort) ? o.sort : VIEW_DEFAULT.sort, hotOnly: !!o.hotOnly,
      hiddenModels: Array.isArray(o.hiddenModels) ? o.hiddenModels.filter((m) => typeof m === "string") : [],
    };
  }
  let view = loadView();
  function saveView() { store.set("view", view); if (lastData) render(lastData); }
  const viewIsDefault = () => view.sort === VIEW_DEFAULT.sort && !view.hotOnly && !view.hiddenModels.length;
  const modelName = (s) => s.modelShort || "unknown";
  const HOT_ZONES = ["orange", "red"];
  function passes(s) {
    if (s.busy) return true;
    if (view.hotOnly && !HOT_ZONES.includes(s.zone)) return false;
    return !view.hiddenModels.includes(modelName(s));
  }
  // the sort key per row: null sorts last, ties keep the list's order (busy first, then last turn newest first)
  const NO_DEADLINE = Number.MAX_SAFE_INTEGER; // a cold cache has no time until cold: after every warm one, before unknown
  const SORT_KEY = {
    last: () => 0,
    size: (s) => (Number.isFinite(s.tokens) ? -s.tokens : null),
    cold: (s) => (!Number.isFinite(s.coldInMs) ? null : s.coldInMs > 0 ? s.coldInMs : NO_DEADLINE),
    started: (s) => { const t = Date.parse(s.startedAt); return Number.isFinite(t) ? -t : null; },
    title: (s) => (s.title ? String(s.title).toLocaleLowerCase() : null),
  };
  function sorted(list) {
    const key = SORT_KEY[view.sort] || SORT_KEY.last;
    return list.map((s, i) => ({ s, i, k: key(s) }))
      .sort((a, b) => {
        if (a.k === null || b.k === null) return (a.k === null) - (b.k === null) || a.i - b.i;
        return (typeof a.k === "string" ? a.k.localeCompare(b.k) : a.k - b.k) || a.i - b.i;
      })
      .map((x) => x.s);
  }

  // ── The zones and the scale, as data. The core decides a session's zone (core.cjs zone()); this list
  // orders the zones in the meter and the legend, names them, and picks the colour pair --kx-<zone> (text)
  // and --kx-<zone>-fill (fills) defined in the style above. LIMITS are the boundaries drawn as dashed lines
  // on the curve, gaps on the context bar and labels on the axis; SCALE is the full width of the bar.
  // A new zone is one entry here, one limit there and one colour pair in the style. ─────────────────
  const ZONES = ["green", "yellow", "orange", "red"];
  const ZONE_NAME = Object.fromEntries(ZONES.map((z) => [z, z]));
  const LIMITS = [100000, 125000, 150000];
  const SCALE = 200000;
  // The prompt cache (core.cjs: cacheTtlMs, coldInMs, hitShare). The core decides warm or cold; "soon" is the
  // panel's marker for a warm cache within SOON_MS of its deadline (or half the TTL, so a 5-minute cache is
  // not "soon" from its first minute). The panel only shows the state; it never sends a turn.
  const SOON_MS = 5 * 60000;
  const TTL_TEXT = { 3600000: "1h", 300000: "5m" };

  // ── Rendering (DOM API only, never innerHTML with data) ────────────────────
  function tokensText(tokens) {
    if (!Number.isFinite(tokens)) return "unknown";
    if (tokens < 1000) return String(tokens);
    if (Math.round(tokens / 1000) < 1000) return `${Math.round(tokens / 1000)}K`;
    return `${(tokens / 1000000).toFixed(1)}M`;
  }

  function sinceText(ms) {
    if (ms === null || ms === undefined) return "no turn";
    if (ms < 60000) return "just now";
    const min = Math.floor(ms / 60000);
    if (min < 60) return `${min} min ago`;
    const h = Math.floor(min / 60);
    if (h < 24) return `${h} h ago`;
    return `${Math.floor(h / 24)} d ago`;
  }

  /** "47 min" until the cache goes cold; "<1 min" in the last minute. The TTL is at most an hour, so minutes suffice. */
  function leftText(ms) {
    return ms < 60000 ? "<1 min" : `${Math.ceil(ms / 60000)} min`;
  }

  /** "1 min 54 s", "40 s"; empty without a number. */
  function durationText(ms) {
    if (!Number.isFinite(ms)) return "";
    const s = Math.round(ms / 1000);
    return s < 60 ? `${s} s` : `${Math.floor(s / 60)} min${s % 60 ? ` ${s % 60} s` : ""}`;
  }

  /** "auto-compacted 1.0M → 66K (1 min 54 s)": one compaction for the curve's tooltip. */
  function compactionText(c) {
    const how = c.trigger === "auto" ? "auto-compacted" : c.trigger === "manual" ? "compacted (/compact)" : "compacted";
    const counts = Number.isFinite(c.preTokens) && Number.isFinite(c.postTokens) ? ` ${tokensText(c.preTokens)} → ${tokensText(c.postTokens)}` : "";
    const took = durationText(c.durationMs);
    return `${how}${counts}${took ? ` (${took})` : ""}`;
  }

  function clockText(iso) {
    const d = new Date(iso);
    return Number.isFinite(d.getTime()) ? d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
  }

  /** "warm", "soon" (warm, within SOON_MS or half the TTL of the deadline) or "cold"; null without a TTL. */
  function cacheState(session) {
    if (session.cacheState !== "warm" && session.cacheState !== "cold") return null;
    if (session.cacheState === "cold") return "cold";
    const soon = Math.min(SOON_MS, (Number.isFinite(session.cacheTtlMs) ? session.cacheTtlMs : SOON_MS * 2) / 2);
    return Number.isFinite(session.coldInMs) && session.coldInMs <= soon ? "soon" : "warm";
  }

  /** "100K and 150K", "100K, 125K and 150K": the limits as words for tooltips. */
  function listText(items) {
    return items.length < 2 ? items.join("") : `${items.slice(0, -1).join(", ")} and ${items[items.length - 1]}`;
  }
  const MARKS_TEXT = listText(LIMITS.map(tokensText));
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  /** "24 Oct 00:06": a day and a time for the facts table; "unknown" without a date. */
  function dayText(iso) {
    const d = new Date(iso);
    return Number.isFinite(d.getTime()) ? `${d.toLocaleDateString([], { day: "2-digit", month: "short" })} ${clockText(iso)}` : "unknown";
  }

  /**
   * The transcript's title, else "new session" (no turns yet: a tab opened and not written to) or "untitled
   * session", with the registry's name ("new session · my-project-08"); `fallback` is true for both of these.
   */
  function titleOf(session) {
    if (session.title) return { text: session.title, fallback: false };
    return { text: [session.turns ? "untitled session" : "new session", session.name].filter(Boolean).join(" · "), fallback: true };
  }
  function titled(e, session) {
    const t = titleOf(session);
    e.textContent = t.text;
    if (t.fallback) e.dataset.fallback = "";
    return e;
  }
  const startText = (session) => (session.startedAt ? `started ${clockText(session.startedAt)}` : "start unknown");
  /** The count, or "—" before the first turn: an empty session is not an unknown count. */
  const countText = (session) => (session.turns || Number.isFinite(session.tokens) ? tokensText(session.tokens) : "—");
  const countLabel = (session) => (session.turns || Number.isFinite(session.tokens) ? `${tokensText(session.tokens)} tokens, zone ${ZONE_NAME[session.zone] || "unknown"}` : "no turns yet");
  // what to do at the next phase boundary, per zone (Pocock's PHASE-BOUNDARIES.md); shown in the bar's tooltip
  const ZONE_ADVICE = {
    yellow: "plan to break at the next phase boundary",
    orange: `break at the first phase boundary; continue only if the next phase fits under ${tokensText(LIMITS[LIMITS.length - 1])}`,
    red: "do not start a new phase: /clear, /handoff, a subagent, or /compact",
  };
  const SCALE_TEXT = `0–${tokensText(SCALE)}`;
  const share = (tokens) => (Number.isFinite(tokens) ? Math.min(1, tokens / SCALE) : 0);
  const pct = (n) => String(Math.round(n * 10000) / 100);

  function el(tag, className, text) {
    const e = document.createElement(tag);
    if (className) e.className = className;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function svgEl(tag, attrs) {
    const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const k of Object.keys(attrs)) e.setAttribute(k, String(attrs[k]));
    return e;
  }

  /**
   * Marks an element with its zone: data-zone for styling and tests, and the two custom properties the
   * style reads (--kx-zone-fill, --kx-zone-text), set through the CSSOM (allowed under the CSP, unlike a
   * style attribute). Children inherit them, so one call per row colours the dot, the bar, the curve and
   * the count. An unknown zone sets neither, and the style falls back to the muted colour.
   */
  function zoned(e, zone) {
    const known = ZONES.includes(zone);
    e.dataset.zone = known ? zone : "unknown";
    if (known) {
      e.style.setProperty("--kx-zone-fill", `var(--kx-${zone}-fill)`);
      e.style.setProperty("--kx-zone-text", `var(--kx-${zone})`);
    }
    return e;
  }

  // Icons: Lucide paths drawn inline (no image files, no icon font)
  const ICON = {
    clock: ["M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z", "M12 6v6l4 2"],
    repeat: ["m17 2 4 4-4 4", "M3 11v-1a4 4 0 0 1 4-4h14", "m7 22-4-4 4-4", "M21 13v1a4 4 0 0 1-4 4H3"],
    cpu: ["M4 4h16v16H4z", "M9 9h6v6H9z", "M9 1v3", "M15 1v3", "M9 20v3", "M15 20v3", "M20 9h3", "M20 14h3", "M1 9h3", "M1 14h3"],
    zap: ["M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"],
    folder: ["M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"],
    moon: ["M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"],
    timer: ["M10 2h4", "m12 14 3-3", "M12 6a8 8 0 1 0 0 16 8 8 0 0 0 0-16z"],
    pen: ["M12 20h9", "M16.376 3.622a1 1 0 0 1 3.002 3.002L7.368 18.635a2 2 0 0 1-.855.506l-2.872.838a.5.5 0 0 1-.62-.62l.838-2.872a2 2 0 0 1 .506-.854z"],
    chevron: ["m9 18 6-6-6-6"],
    refresh: ["M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8", "M3 3v5h5", "M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16", "M16 16h5v5"],
    back: ["m12 19-7-7 7-7", "M19 12H5"],
    play: ["M5 3v18l15-9z"],
  };
  function icon(name) {
    const svg = svgEl("svg", { class: "kx-ico", viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", "stroke-width": 2, "stroke-linecap": "round", "stroke-linejoin": "round", "aria-hidden": "true" });
    for (const d of ICON[name]) svg.appendChild(svgEl("path", { d }));
    return svg;
  }

  // ── Sparkline: tokens per turn, oldest left. The viewBox is 100 × 24 and stretched to its column
  // (preserveAspectRatio none), so x is the turn's share of the width and strokes are non-scaling. The
  // y-axis runs from 0 to the larger of SCALE and the series' top, so the limit lines always show and rows
  // compare. Fewer than two points: no curve.
  const CURVE_W = 100, CURVE_H = 24;
  const num = (n) => String(Math.round(n * 100) / 100);

  function curveFor(session) {
    // the core only pushes numbers, and dips index this very list, so it is drawn as it comes
    const series = Array.isArray(session.series) ? session.series : [];
    if (series.length < 2) return null;
    const top = Math.max(SCALE, ...series);
    const x = (i) => (i / (series.length - 1)) * CURVE_W;
    const y = (v) => CURVE_H - 1 - (v / top) * (CURVE_H - 2); // 1 px margin top and bottom for the stroke
    const dips = Array.isArray(session.dips) ? session.dips.filter((i) => i > 0 && i < series.length) : [];
    const compactions = Array.isArray(session.compactions) ? session.compactions.filter((c) => c && c.at > 0 && c.at < series.length) : [];
    const label = `Tokens per turn, ${plural(series.length, "turn", "turns")}, ${plural(compactions.length, "compaction", "compactions")}, ${plural(dips.length, "other drop", "other drops")}`;
    const svg = svgEl("svg", {
      class: "kx-curve", viewBox: `0 0 ${CURVE_W} ${CURVE_H}`, preserveAspectRatio: "none", role: "img",
      "data-testid": "curve", "data-points": series.length, "aria-label": label,
    });
    const title = svgEl("title", {});
    const marks = compactions.map((c) => ` · turn ${c.at + 1}: ${compactionText(c)}`).join("");
    title.textContent = `${label} · dashed lines at ${MARKS_TEXT}${marks}${dips.length ? " · dotted marks: drops without a compaction entry" : ""}`;
    svg.appendChild(title);
    for (const g of LIMITS) svg.appendChild(svgEl("line", { class: "kx-limit", "data-limit": g, x1: 0, x2: CURVE_W, y1: num(y(g)), y2: num(y(g)), "vector-effect": "non-scaling-stroke" }));
    const points = series.map((v, i) => `${num(x(i))},${num(y(v))}`).join(" L");
    svg.appendChild(svgEl("path", { class: "kx-area", d: `M0,${CURVE_H} L${points} L${CURVE_W},${CURVE_H} Z` }));
    svg.appendChild(svgEl("path", { class: "kx-line", d: `M${points}`, "vector-effect": "non-scaling-stroke" }));
    for (const i of dips) svg.appendChild(svgEl("line", { class: "kx-dip", "data-turn": i, x1: num(x(i)), x2: num(x(i)), y1: 0, y2: CURVE_H, "vector-effect": "non-scaling-stroke" }));
    for (const c of compactions) svg.appendChild(svgEl("line", { class: "kx-compact", "data-turn": c.at, "data-trigger": c.trigger || "unknown", x1: num(x(c.at)), x2: num(x(c.at)), y1: 0, y2: CURVE_H, "vector-effect": "non-scaling-stroke" }));
    return svg;
  }

  /**
   * Output per turn as bars under the curve, one per turn of the series (the output series is aligned to its
   * right end, so an older state with a shorter one still lines up), scaled to the session's own largest turn.
   * The thinking part of each bar is drawn over it, from the bottom. Nothing when no turn wrote anything.
   * `className` sizes it: the row's strip, or the detail view's taller one.
   */
  const OUT_H = 8;
  function outputFor(session, className = "kx-out") {
    const series = Array.isArray(session.series) ? session.series : [];
    const output = Array.isArray(session.outputSeries) ? session.outputSeries.slice(-series.length) : [];
    const thinking = Array.isArray(session.thinkingSeries) ? session.thinkingSeries.slice(-series.length) : [];
    const top = Math.max(0, ...output);
    if (series.length < 2 || !top) return null;
    const offset = series.length - output.length, w = CURVE_W / series.length, gap = series.length <= 60 ? w * 0.2 : 0;
    const bar = (i, v) => (v > 0 ? `M${num((i + offset) * w)},${OUT_H} h${num(w - gap)} v${num(-(v / top) * OUT_H)} h${num(gap - w)} Z` : "");
    const svg = svgEl("svg", { class: className, viewBox: `0 0 ${CURVE_W} ${OUT_H}`, preserveAspectRatio: "none", role: "img", "data-testid": "output", "data-bars": output.length, "aria-label": `Output tokens per turn, largest ${tokensText(top)}` });
    const title = svgEl("title", {});
    title.textContent = `Output tokens per turn (faint) and the thinking part of them (strong), scaled to the largest turn: ${tokensText(top)}`;
    svg.appendChild(title);
    svg.appendChild(svgEl("path", { class: "kx-out-all", d: output.map((v, i) => bar(i, v)).join(" ") || "M0,0" }));
    svg.appendChild(svgEl("path", { class: "kx-out-think", d: thinking.map((v, i) => bar(i, Math.min(v, output[i] || 0))).join(" ") || "M0,0" }));
    return svg;
  }

  /** "48K out" with the last turn and the thinking share in the tooltip; null before the first turn. */
  function outputMeta(session) {
    if (!session.turns || !Number.isFinite(session.outputTotal)) return null;
    const span = el("span", "kx-output");
    span.dataset.testid = "output-total";
    span.appendChild(icon("pen"));
    span.appendChild(document.createTextNode(`${tokensText(session.outputTotal)} out`));
    const out = Array.isArray(session.outputSeries) ? session.outputSeries : [], th = Array.isArray(session.thinkingSeries) ? session.thinkingSeries : [];
    const last = out.length ? `last turn ${tokensText(out[out.length - 1])} out, ${tokensText(th[th.length - 1] || 0)} thinking · ` : "";
    const shareText = session.outputTotal > 0 && Number.isFinite(session.thinkingTotal) ? `, ${Math.round((session.thinkingTotal / session.outputTotal) * 100)} % thinking` : "";
    span.title = `Output: ${last}session ${tokensText(session.outputTotal)} out${shareText} · what the model writes is read back as input on the next turn`;
    return span;
  }

  /** "browser_click" for "mcp__royktest__browser_click": an MCP tool by its own name, without the server. */
  const sourceName = (source) => (/^mcp__/.test(source) ? source.split("__").pop() : source);
  const GROWTH_TOP = 3;
  const GROWTH_HOW = "per turn, what the model wrote (output) first, the rest split by length over the tool results (by tool), your messages (you) and attachments and reminders (other); a fall is not counted";
  const growthRows = (session) => (Array.isArray(session.growth) ? session.growth : []);
  const growthSince = (session) => (session.baselineCause === "compaction" ? "since the compaction" : "since the first turn");

  /**
   * "≈ Bash 39K · Read 27K · output 10K": the largest sources of the segment's growth (core.cjs growth, largest
   * first), every source in the tooltip with its share. Nothing before the second turn of a segment.
   */
  function growthFor(session) {
    const list = growthRows(session);
    if (!list.length) return null;
    const line = el("div", "kx-growth", `≈ ${list.slice(0, GROWTH_TOP).map((g) => `${sourceName(g.source)} ${tokensText(g.tokens)}`).join(" · ")}`);
    line.dataset.testid = "growth";
    line.title = `Where the context grew ${growthSince(session)}, estimated: ${list.map((g) => `${sourceName(g.source)} ${tokensText(g.tokens)} (${Math.round(g.share * 100)} %)`).join(", ")} · ${GROWTH_HOW}`;
    return line;
  }

  /** "start 62K · conversation 41K", or "start after compaction 35K · …"; empty without a baseline. */
  function baselineText(session) {
    if (!Number.isFinite(session.baseline) || !Number.isFinite(session.tokens)) return "";
    const start = session.baselineCause === "compaction" ? "start after compaction" : "start";
    return `${start} ${tokensText(session.baseline)} · conversation ${tokensText(Math.max(0, session.tokens - session.baseline))}`;
  }

  /**
   * The context bar: the fill is the count's share of SCALE, its first part the segment's start (the baseline)
   * in a muted shade, a gap at every limit, a hatched end above SCALE; the tooltip carries the split and the zone's advice.
   */
  function barFor(session) {
    const bar = el("div", "kx-bar");
    bar.setAttribute("role", "img");
    bar.dataset.testid = "bar";
    const known = Number.isFinite(session.tokens);
    const advice = ZONE_ADVICE[session.zone] ? ` · ${ZONE_ADVICE[session.zone]}` : "";
    const split = baselineText(session);
    bar.title = known ? `${tokensText(session.tokens)} tokens in the context${split ? `: ${split}` : ""} · scale ${SCALE_TEXT}, marks at ${MARKS_TEXT}${advice}` : "no count yet";
    bar.setAttribute("aria-label", !known ? "no count" : session.tokens > SCALE ? `over the ${tokensText(SCALE)} scale` : `${Math.round(share(session.tokens) * 100)} % of the ${tokensText(SCALE)} scale`);
    const fill = el("span", "kx-fill" + (session.busy ? " kx-busy" : ""));
    fill.style.setProperty("--p", pct(share(session.tokens)));
    if (split) {
      const base = el("span", "kx-base");
      base.dataset.testid = "baseline";
      base.dataset.cause = session.baselineCause || "unknown";
      base.style.setProperty("--b", pct(Math.min(1, session.baseline / session.tokens)));
      fill.appendChild(base);
    }
    bar.appendChild(fill);
    for (const g of LIMITS) {
      const tick = el("span", "kx-tick");
      tick.style.setProperty("--t", pct(g / SCALE));
      bar.appendChild(tick);
    }
    if (known && session.tokens > SCALE) bar.appendChild(el("span", "kx-over"));
    return bar;
  }

  function rowFor(session) {
    const row = zoned(el("article", "kx-session" + (session.dimmed ? " kx-dimmed" : "")), session.zone);
    row.dataset.session = session.sessionId || "";
    if (session.sessionId) {
      // the whole row is the click target; clicks and keys are handled once on the list (openFromList)
      row.tabIndex = 0;
      row.setAttribute("role", "button");
      row.setAttribute("aria-label", `Open details: ${titleOf(session).text}, ${countLabel(session)}`);
    }
    const titleRow = el("div", "kx-row-title");
    const dot = el("span", "kx-dot" + (session.busy ? " kx-pulse" : ""));
    dot.title = `Zone: ${ZONE_NAME[session.zone] || "unknown"}`;
    titleRow.appendChild(dot);
    const title = titled(el("div", "kx-title"), session);
    title.title = title.textContent;
    titleRow.appendChild(title);
    if (session.busy) {
      const badge = el("span", "kx-badge");
      badge.appendChild(icon("zap"));
      badge.appendChild(document.createTextNode("busy"));
      titleRow.appendChild(badge);
    }
    row.appendChild(titleRow);
    const count = el("div", "kx-count");
    const tokens = zoned(el("div", "kx-num", countText(session)), session.zone);
    tokens.dataset.testid = "tokens";
    tokens.setAttribute("aria-label", countLabel(session));
    count.appendChild(tokens);
    if (ZONE_NAME[session.zone]) count.appendChild(el("span", "kx-zone-txt", ZONE_NAME[session.zone]));
    row.appendChild(count);
    const barCol = el("div", "kx-bar-col");
    barCol.appendChild(barFor(session));
    const growth = growthFor(session);
    if (growth) barCol.appendChild(growth);
    row.appendChild(barCol);
    const curveWrap = el("div", "kx-curve-wrap");
    curveWrap.appendChild(curveFor(session) || el("span", "kx-nocurve", session.turns ? "one turn, no curve yet" : "no turns yet"));
    const outputBars = outputFor(session);
    if (outputBars) curveWrap.appendChild(outputBars);
    row.appendChild(curveWrap);
    const meta = el("div", "kx-meta");
    const add = (name, text) => { const s = el("span"); s.appendChild(icon(name)); s.appendChild(document.createTextNode(text)); meta.appendChild(s); };
    if (!session.turns) add("play", startText(session)); // no model, turns or last turn to show yet; the curve says "no turns yet"
    else {
      add("cpu", (session.modelShort || "unknown") + (session.effort ? ` · ${session.effort}` : ""));
      if (session.effort) meta.lastChild.title = `Model and the effort level of the last turn`;
      add("repeat", `${session.turns} ${session.turns === 1 ? "turn" : "turns"}`);
      const output = outputMeta(session);
      if (output) meta.appendChild(output);
      add("clock", sinceText(session.sinceMs));
    }
    const cache = cacheFor(session);
    if (cache) meta.appendChild(cache);
    row.dataset.cache = cache ? cache.dataset.cache : "unknown";
    row.appendChild(meta);
    return row;
  }

  /**
   * The prompt cache of a session: "warm · 47 min" or "cold" with the TTL as a pill; the tooltip has the
   * deadline, the hit share of the last turn (read from cache / context) and the tokens written. Nothing
   * without a TTL (a transcript from before Claude Code wrote usage.cache_creation).
   */
  function cacheFor(session) {
    const state = cacheState(session);
    if (!state) return null;
    const span = el("span", "kx-cache");
    span.dataset.testid = "cache";
    span.dataset.cache = state;
    span.appendChild(icon("timer"));
    span.appendChild(document.createTextNode(state === "cold" ? "cold" : `warm · ${leftText(session.coldInMs)}`));
    const ttl = TTL_TEXT[session.cacheTtlMs];
    if (ttl) {
      const pill = el("span", "kx-ttl", ttl);
      pill.dataset.ttl = ttl;
      span.appendChild(pill);
    }
    const hit = Number.isFinite(session.hitShare) ? `${Math.round(session.hitShare * 100)} %` : "unknown";
    const read = Number.isFinite(session.cacheRead) ? tokensText(session.cacheRead) : "unknown";
    const written = Number.isFinite(session.cacheCreated) ? tokensText(session.cacheCreated) : "unknown";
    const ttlText = ttl === "1h" ? "1-hour" : ttl === "5m" ? "5-minute" : "unknown";
    const when = state === "cold" ? `cold since ${clockText(session.coldAt)}` : `cold at ${clockText(session.coldAt)} unless a turn is sent (in ${leftText(session.coldInMs)})`;
    span.title = `Prompt cache: ${ttlText} TTL, ${when} · last turn: ${read} read from cache (${hit} of the context), ${written} written · a cold cache rewrites the whole context on the next turn`;
    return span;
  }

  /**
   * A group heading whose whole text is a fold button: aria-expanded says whether the rows under it are
   * drawn, the count stays visible when folded. `key` is the group's name in `folded` (or `unfolded`); the rows under it
   * come from rowsFor(), which links them through aria-controls.
   */
  function groupHeading(text, n, iconName, className, key) {
    const h = el("h2", "kx-group" + (className ? ` ${className}` : ""));
    const open = !isFolded(key);
    const btn = el("button", "kx-fold");
    btn.type = "button";
    btn.dataset.testid = "fold";
    btn.dataset.group = key;
    btn.setAttribute("aria-expanded", String(open));
    btn.title = `${open ? "Collapse" : "Expand"} ${text}`;
    const chev = icon("chevron");
    chev.classList.add("kx-chev");
    btn.appendChild(chev);
    btn.appendChild(icon(iconName));
    btn.appendChild(document.createTextNode(text));
    btn.appendChild(el("span", "kx-gn", `· ${n}`));
    btn.addEventListener("click", () => {
      toggleFold(key);
      if (lastData) render(lastData);
    });
    h.appendChild(btn);
    return h;
  }

  /** The rows container of a group, linked from its heading's button; null when the group is folded (nothing is drawn). */
  function rowsFor(heading, idKey) {
    if (heading.firstChild.getAttribute("aria-expanded") !== "true") return null;
    const rows = el("div", "kx-rows");
    rows.id = `kx-rows-${idKey.replace(/[^\w-]+/g, "_")}`;
    heading.firstChild.setAttribute("aria-controls", rows.id);
    return rows;
  }

  /** The axis line above a group in the wide layout: the column names and the bar's marks at their positions. */
  function axisLine() {
    const axis = el("div", "kx-axis");
    axis.setAttribute("aria-hidden", "true");
    axis.appendChild(el("span", "", "session"));
    const scale = el("div", "kx-scale");
    for (const v of [0, ...LIMITS, SCALE]) {
      const s = el("span", "", tokensText(v));
      s.style.setProperty("--t", pct(v / SCALE));
      scale.appendChild(s);
    }
    axis.appendChild(scale);
    axis.appendChild(el("span", "", "tokens per turn"));
    axis.appendChild(el("span", "kx-r", "context"));
    return axis;
  }

  /**
   * The sessions as three groups, busy, idle and idle over an hour (the core's `abandoned`, folded at first),
   * each with its heading and axis; the order within a group is the list's. A folded group keeps its heading and
   * count and draws no rows. `project` only makes the rows' ids unique.
   */
  function groupsFor(sessions, project) {
    const frag = document.createDocumentFragment();
    const parts = [["Working now", "zap", "busy", sessions.filter((s) => s.busy)],
      ["Idle", "moon", "idle", sessions.filter((s) => !s.busy && !s.abandoned)],
      ["Idle over an hour", "clock", "abandoned", sessions.filter((s) => s.abandoned)]];
    for (const [text, iconName, key, all] of parts) {
      if (!all.length) continue;
      const list = sorted(all.filter(passes));
      // the heading counts what is shown; "4 of 9" while the filters hide some, so the hidden ones are not forgotten
      const heading = groupHeading(text, list.length === all.length ? list.length : `${list.length} of ${all.length}`, iconName, "", key);
      frag.appendChild(heading);
      const rows = rowsFor(heading, project ? `${project}/${key}` : key);
      if (!rows) continue;
      if (!list.length) {
        rows.appendChild(el("p", "kx-hidden-all", `all ${all.length} hidden by the filters`));
      } else {
        rows.appendChild(axisLine());
        for (const s of list) rows.appendChild(rowFor(s));
      }
      frag.appendChild(rows);
    }
    return frag;
  }

  /** Every session of the payload, grouped or not. */
  const allSessions = (data) => (data.groups ? data.groups.flatMap((g) => g.sessions) : data.sessions) || [];

  /**
   * The controls follow the view and the list: the select shows the sort, the hot chip its state, one chip
   * per model in the list (pressed = shown; kept in place between renders so focus survives a click), "reset"
   * only when something is off default. A model no longer in the list is dropped from hiddenModels.
   */
  function renderControls(sessions) {
    sortEl.value = view.sort;
    hotEl.setAttribute("aria-pressed", String(view.hotOnly));
    const present = [...new Set(sessions.map(modelName))].sort((a, b) => a.localeCompare(b));
    const pruned = view.hiddenModels.filter((m) => present.includes(m));
    if (pruned.length !== view.hiddenModels.length) { view.hiddenModels = pruned; store.set("view", view); }
    const chips = new Map([...modelsEl.querySelectorAll(".kx-chip")].map((c) => [c.dataset.model, c]));
    for (const [name, chip] of chips) if (!present.includes(name)) { chip.remove(); chips.delete(name); }
    let before = modelsEl.firstChild;
    for (const name of present) {
      let chip = chips.get(name);
      if (!chip) {
        chip = el("button", "kx-chip", name);
        chip.type = "button";
        chip.dataset.testid = "filter-model";
        chip.dataset.model = name;
        chip.addEventListener("click", () => {
          view.hiddenModels = view.hiddenModels.includes(name) ? view.hiddenModels.filter((m) => m !== name) : [...view.hiddenModels, name];
          saveView();
        });
      }
      chip.setAttribute("aria-pressed", String(!view.hiddenModels.includes(name)));
      chip.title = `${view.hiddenModels.includes(name) ? "Show" : "Hide"} the ${name} sessions`;
      // keep the chips in the sorted order without rebuilding them: `before` walks the existing chips
      if (chip === before) before = before.nextSibling; else modelsEl.insertBefore(chip, before);
    }
    modelsEl.hidden = present.length < 2;
    resetEl.hidden = viewIsDefault();
  }

  // ── Detail view of one session: replaces the header, the controls and the list in the same webview. The
  // open session is kept in the webview state in VS Code and in the hash (#<sessionId>) on a dev server.
  // Every list draws it again, so the curve grows with the session; the turn in the tooltip, the focus and
  // a copy receipt survive that redraw. The list has the last 200 turns of a session; on open and after every
  // list the panel asks the host for all of them (core.cjs SessionReader.detail), and draws again with those. ──
  const D_W = 100, D_H = 100; // the large curve's viewBox, stretched to its field like the sparkline's
  const D_FIELD_H = { narrow: 150, wide: 220 }; // the field's height in the style (.kx-d-field), below and above 620 px
  const AXIS_GAP_PX = 11; // an axis label is about 10 px tall; neighbours closer than this would overlap
  const COPIED_MS = 2000;
  let openId = null; // the sessionId shown, null while the list is shown
  let turnShown = null; // the turn number in the curve's tooltip, null when none is shown
  let focusBack = false; // the back button takes the focus on the next draw (a session was just opened)
  let redrawing = false; // the detail is being replaced: a blur from that is not the user's
  let listScroll = 0; // the list's scroll position, restored on the way back
  const copied = {}; // copy button key → { until, text } while its receipt shows
  let detailAnswer = null; // the host's last answer for the open session, { sessionId, detail }: every turn of it
  let askDetail = null; // the adapter's way to ask the host for that answer; set at the end

  function requestDetail() { if (openId && askDetail) askDetail(openId); }

  /** The host's answer: drawn when it is for the session still open; without a detail the list's 200 turns stay. */
  function onDetail(answer) {
    if (!answer || answer.sessionId !== openId) return;
    detailAnswer = answer.detail && typeof answer.detail === "object" ? answer : null;
    drawDetail();
  }

  /**
   * The large curve: zone bands, dashed limits, area and line in the zone colour, compactions as solid lines
   * with their label, dips dotted, the segment's start labelled at the bottom, the axis at the right edge.
   * Hovering shows a hairline and "turn 2 · 60K · +9K from turn 1"; the range under it does the same from the
   * keyboard. Until the host's detail has come the series is the list's last SERIES_MAX turns (core.cjs), so
   * its first point is turn `first`; with the detail it is every turn and `first` is 1.
   */
  function detailCurve(session) {
    const wrap = el("div", "kx-d-sec");
    const series = Array.isArray(session.series) ? session.series : [];
    const turns = Math.max(session.turns || 0, series.length);
    const first = turns - series.length + 1, last = turns;
    const compactions = Array.isArray(session.compactions) ? session.compactions.filter((c) => c && c.at >= 0 && c.at < series.length) : [];
    const dips = Array.isArray(session.dips) ? session.dips.filter((i) => i > 0 && i < series.length) : [];
    const lbl = el("div", "kx-d-lbl");
    const span = first > 1 ? `last ${series.length} of ${plural(turns, "turn", "turns")}` : plural(series.length, "turn", "turns");
    const summary = el("span", "", !turns ? "Tokens per turn" // the field below says "no turns yet"
      : `Tokens per turn · ${span} · ${plural(compactions.length, "compaction", "compactions")}${dips.length ? ` · ${plural(dips.length, "other drop", "other drops")}` : ""}`);
    summary.dataset.testid = "detail-curve-label";
    lbl.appendChild(summary);
    const legend = (text, dashed) => { const s = el("span", "kx-d-leg"); s.appendChild(el("i", dashed ? "kx-d-dash" : "")); s.appendChild(document.createTextNode(text)); lbl.appendChild(s); };
    legend("compaction", false);
    legend(LIMITS.map(tokensText).join(" · "), true);
    wrap.appendChild(lbl);
    const field = el("div", "kx-d-field");
    field.dataset.testid = "detail-curve";
    wrap.appendChild(field);
    if (series.length < 2) { field.appendChild(el("p", "kx-message", session.turns ? "one turn, no curve yet" : "no turns yet")); return wrap; }
    const top = Math.max(SCALE, ...series);
    const x = (i) => (i / (series.length - 1)) * D_W;
    const y = (v) => D_H - 1 - (v / top) * (D_H - 2);
    const svg = svgEl("svg", { class: "kx-d-curve", viewBox: `0 0 ${D_W} ${D_H}`, preserveAspectRatio: "none", role: "img", "data-points": series.length, "aria-label": `Tokens per turn, ${span}; now ${tokensText(session.tokens)}` });
    const bands = [["green", 0, LIMITS[0]], ["yellow", LIMITS[0], LIMITS[1]], ["orange", LIMITS[1], LIMITS[2]], ["red", LIMITS[2], top]];
    for (const [z, a, b] of bands) {
      const r = svgEl("rect", { class: "kx-d-band", x: 0, width: D_W, y: num(y(b)), height: num(y(a) - y(b)) });
      r.style.setProperty("--kx-band", `var(--kx-${z}-fill)`);
      svg.appendChild(r);
    }
    for (const g of LIMITS) svg.appendChild(svgEl("line", { class: "kx-limit", x1: 0, x2: D_W, y1: num(y(g)), y2: num(y(g)), "vector-effect": "non-scaling-stroke" }));
    const points = series.map((v, i) => `${num(x(i))},${num(y(v))}`).join(" L");
    svg.appendChild(svgEl("path", { class: "kx-area", d: `M0,${D_H} L${points} L${D_W},${D_H} Z` }));
    svg.appendChild(svgEl("path", { class: "kx-line", d: `M${points}`, "vector-effect": "non-scaling-stroke" }));
    for (const i of dips) svg.appendChild(svgEl("line", { class: "kx-dip", "data-turn": first + i, x1: num(x(i)), x2: num(x(i)), y1: 0, y2: D_H, "vector-effect": "non-scaling-stroke" }));
    for (const c of compactions) svg.appendChild(svgEl("line", { class: "kx-compact", "data-turn": first + c.at, x1: num(x(c.at)), x2: num(x(c.at)), y1: 0, y2: D_H, "vector-effect": "non-scaling-stroke" }));
    field.appendChild(svg);
    // the axis labels: the limits and the top of the scale; when the scale runs far above 200K the limits sit
    // close together, so the middle one goes first and then the lowest, and they never overlap. How many fit
    // is decided for both field heights; the style shows data-axis below 620 px and data-axis-wide above
    const room = (y(LIMITS[0]) - y(LIMITS[LIMITS.length - 1])) / D_H;
    const fits = (h) => (room * h >= 2 * AXIS_GAP_PX ? 3 : room * h >= AXIS_GAP_PX ? 2 : 1);
    field.dataset.axis = fits(D_FIELD_H.narrow);
    field.dataset.axisWide = fits(D_FIELD_H.wide);
    const axisClass = { [LIMITS[0]]: " kx-d-axis-low", [LIMITS[1]]: " kx-d-axis-mid" };
    for (const g of [...LIMITS, top]) {
      const a = el("span", `kx-d-axis${g === top ? "" : axisClass[g] || ""}`, tokensText(g));
      a.setAttribute("aria-hidden", "true");
      a.style.top = `${pct(y(g) / D_H)}%`;
      field.appendChild(a);
    }
    // a label near the right edge is anchored to its right, near the left edge to its left, so it stays in the field
    for (const c of compactions) {
      const m = el("span", "kx-d-mark", compactionText(c));
      m.dataset.testid = "detail-compaction";
      const left = x(c.at) / D_W;
      if (left > 0.6) { m.style.left = `calc(${pct(left)}% - 2px)`; m.style.transform = "translateX(-100%)"; m.style.maxWidth = "60%"; }
      else if (left < 0.25) { m.style.left = `calc(${pct(left)}% + 2px)`; m.style.transform = "none"; }
      else m.style.left = `${pct(left)}%`;
      m.title = `turn ${first + c.at}: ${compactionText(c)}`;
      field.appendChild(m);
    }
    if (Number.isFinite(session.baselineAt) && session.baselineAt >= 0 && session.baselineAt < series.length && Number.isFinite(session.baseline)) {
      const m = el("span", "kx-d-mark kx-d-start", `${session.baselineCause === "compaction" ? "start after compaction" : "start"} ${tokensText(session.baseline)}`);
      m.dataset.testid = "detail-start";
      m.style.left = `${pct(Math.min(0.9, Math.max(0.1, x(session.baselineAt) / D_W)))}%`;
      field.appendChild(m);
    }
    const hair = el("div", "kx-d-hair"), tip = el("div", "kx-d-tip");
    tip.dataset.testid = "detail-tip";
    field.appendChild(hair);
    field.appendChild(tip);
    const row = el("div", "kx-d-turn-row");
    const lab = el("label", "", "Turn");
    lab.htmlFor = "kx-d-turn";
    const range = el("input", "kx-d-turn");
    range.type = "range";
    range.id = lab.htmlFor;
    range.dataset.testid = "detail-turn";
    range.min = String(first);
    range.max = String(last);
    range.value = String(last);
    const val = el("span", "kx-d-turn-val", `${last} / ${last}`);
    val.dataset.testid = "detail-turn-value";
    row.appendChild(lab);
    row.appendChild(range);
    row.appendChild(val);
    function show(i) {
      const v = series[i], prev = i > 0 ? series[i - 1] : null;
      const delta = prev === null ? "" : ` · ${v >= prev ? "+" : "−"}${tokensText(Math.abs(v - prev))} from turn ${first + i - 1}`;
      const comp = compactions.find((c) => c.at === i);
      tip.textContent = "";
      tip.appendChild(document.createTextNode(`turn ${first + i} · `));
      tip.appendChild(el("b", "", tokensText(v)));
      tip.appendChild(document.createTextNode(delta));
      if (comp) { tip.appendChild(el("br")); tip.appendChild(document.createTextNode(compactionText(comp))); }
      const left = x(i) / D_W;
      hair.style.left = `${pct(left)}%`;
      tip.style.left = left < 0.6 ? `calc(${pct(left)}% + 8px)` : "auto";
      tip.style.right = left < 0.6 ? "auto" : `calc(${pct(1 - left)}% + 8px)`;
      field.classList.add("kx-d-hover");
      turnShown = first + i;
      range.value = String(turnShown);
      range.setAttribute("aria-valuetext", tip.textContent);
      val.textContent = `${turnShown} / ${last}`;
    }
    function hide() {
      if (redrawing) return;
      field.classList.remove("kx-d-hover");
      turnShown = null;
    }
    const at = (turn) => Math.max(0, Math.min(series.length - 1, turn - first));
    field.addEventListener("mousemove", (e) => {
      const r = field.getBoundingClientRect();
      show(Math.max(0, Math.min(series.length - 1, Math.round(((e.clientX - r.left) / r.width) * (series.length - 1)))));
    });
    field.addEventListener("mouseleave", hide);
    range.addEventListener("input", () => show(at(Number(range.value))));
    range.addEventListener("focus", () => show(at(Number(range.value))));
    range.addEventListener("blur", hide);
    if (turnShown !== null && turnShown >= first && turnShown <= last) show(turnShown - first); else turnShown = null;
    wrap.appendChild(row);
    const out = outputFor(session, "kx-d-out");
    if (out) {
      wrap.appendChild(out);
      const largest = Math.max(0, ...(Array.isArray(session.outputSeries) ? session.outputSeries.slice(-series.length) : []));
      wrap.appendChild(el("div", "kx-d-lbl", `Output per turn (faint) and the thinking part (strong) · largest ${tokensText(largest)}`));
    }
    return wrap;
  }

  /** Copies `text`: the clipboard API, else a hidden textarea and execCommand. True when either worked. */
  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch { /* no clipboard API in this frame: the older way */ }
    const area = el("textarea");
    area.value = text;
    area.setAttribute("readonly", "");
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch { ok = false; }
    area.remove();
    return ok;
  }

  /** A value in code with a "copy" button that says "copied" for two seconds; `key` names it across redraws. */
  function copyable(key, text) {
    const span = el("span");
    span.appendChild(el("code", "", text));
    const b = el("button", "kx-d-copy");
    b.type = "button";
    b.dataset.testid = `copy-${key}`;
    b.setAttribute("aria-label", `Copy ${text}`);
    const receipt = copied[key] && copied[key].until > Date.now() ? copied[key] : null;
    b.textContent = receipt ? receipt.text : "copy";
    if (receipt && receipt.text === "copied") b.dataset.done = "";
    b.addEventListener("click", async () => {
      const ok = await copyText(text);
      copied[key] = { until: Date.now() + COPIED_MS, text: ok ? "copied" : "copy failed" };
      const now = detailEl.querySelector(`[data-testid="copy-${key}"]`) || b; // a redraw may have replaced the button
      now.textContent = copied[key].text;
      if (ok) now.dataset.done = ""; else delete now.dataset.done;
      if (document.activeElement === document.body) now.focus({ preventScroll: true }); // the textarea way took the focus
      setTimeout(() => {
        if (copied[key] && copied[key].until > Date.now()) return; // a later click owns the receipt
        delete copied[key];
        const current = detailEl.querySelector(`[data-testid="copy-${key}"]`);
        if (current) { current.textContent = "copy"; delete current.dataset.done; }
      }, COPIED_MS);
    });
    span.appendChild(b);
    return span;
  }

  /** The facts: "Prompt cache and output" and "Session", side by side from 620 px, key over value below that. */
  function detailFacts(session) {
    const wrap = el("div", "kx-d-sec kx-d-facts");
    wrap.dataset.testid = "detail-facts";
    const table = (caption, rows) => {
      const t = el("table");
      t.appendChild(el("caption", "", caption));
      const body = el("tbody");
      for (const [k, v] of rows) {
        const tr = el("tr");
        const th = el("th", "", k);
        th.scope = "row";
        const td = el("td");
        if (typeof v === "string") td.textContent = v; else td.appendChild(v);
        tr.appendChild(th);
        tr.appendChild(td);
        body.appendChild(tr);
      }
      t.appendChild(body);
      return t;
    };
    const ttl = TTL_TEXT[session.cacheTtlMs];
    const ttlEl = el("span");
    if (ttl) {
      const pill = el("span", "kx-ttl", ttl);
      pill.dataset.ttl = ttl;
      ttlEl.appendChild(pill);
      ttlEl.appendChild(document.createTextNode(ttl === "1h" ? " 1-hour" : " 5-minute"));
    } else ttlEl.textContent = "unknown";
    const now = session.cacheState === "cold" ? `cold since ${clockText(session.coldAt)}`
      : session.cacheState === "warm" ? `warm · ${leftText(session.coldInMs)} left (cold at ${clockText(session.coldAt)})` : "unknown";
    const thinking = session.outputTotal > 0 && Number.isFinite(session.thinkingTotal) ? `${tokensText(session.thinkingTotal)} (${Math.round((session.thinkingTotal / session.outputTotal) * 100)} %)` : "unknown";
    const out = Array.isArray(session.outputSeries) ? session.outputSeries : [], th = Array.isArray(session.thinkingSeries) ? session.thinkingSeries : [];
    wrap.appendChild(table("Prompt cache and output", [
      ["Cache TTL", ttlEl],
      ["Cache now", now],
      ["Last turn read from cache", Number.isFinite(session.cacheRead) ? `${tokensText(session.cacheRead)} (${Number.isFinite(session.hitShare) ? `${Math.round(session.hitShare * 100)} %` : "unknown share"} of the context)` : "unknown"],
      ["Last turn written to cache", Number.isFinite(session.cacheCreated) ? tokensText(session.cacheCreated) : "unknown"],
      ["Output, whole session", Number.isFinite(session.outputTotal) ? tokensText(session.outputTotal) : "unknown"],
      ["Of it thinking", thinking],
      ["Output, last turn", out.length ? `${tokensText(out[out.length - 1])} (${tokensText(th[th.length - 1] || 0)} thinking)` : "unknown"],
    ]));
    wrap.appendChild(table("Session", [
      ["Turns", String(session.turns || 0)],
      ["Started", session.startedAt ? dayText(session.startedAt) : "unknown"],
      ["Last turn", session.lastTurn ? `${dayText(session.lastTurn)} (${sinceText(session.sinceMs)})` : "no turn"],
      ["Model · effort", `${session.modelShort || "unknown"}${session.effort ? ` · ${session.effort}` : ""}`],
      ["Working folder", session.cwd || "unknown"],
      ["Process id", Number.isFinite(session.pid) ? copyable("pid", String(session.pid)) : "unknown"],
      ["Session id", session.sessionId ? copyable("session", session.sessionId) : "unknown"],
    ]));
    return wrap;
  }

  /** Where the context went since the segment's start: one bar per source, largest first (core.cjs growth), the estimate's caveat once under them. */
  function detailGrowth(session) {
    const wrap = el("div", "kx-d-sec");
    wrap.dataset.testid = "detail-growth";
    const h = el("h2", "kx-group");
    h.appendChild(icon("play"));
    h.appendChild(document.createTextNode(`Where the context went ${growthSince(session)}`));
    wrap.appendChild(h);
    const rows = growthRows(session);
    if (!rows.length) { wrap.appendChild(el("p", "kx-d-note", session.turns ? "nothing yet since the segment's first turn" : "no turns yet")); return wrap; }
    const bars = el("div", "kx-d-bars");
    for (const g of rows) {
      const name = el("span", "kx-d-bar-n", sourceName(g.source));
      name.title = g.source;
      const bar = el("span", "kx-d-bar");
