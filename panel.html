      bar.setAttribute("aria-hidden", "true");
      const fill = el("i");
      fill.style.setProperty("--p", pct(g.tokens / rows[0].tokens));
      bar.appendChild(fill);
      bars.appendChild(name);
      bars.appendChild(bar);
      bars.appendChild(el("span", "kx-d-bar-v", tokensText(g.tokens)));
      bars.appendChild(el("span", "kx-d-bar-s", `${Math.round(g.share * 100)} %`));
    }
    wrap.appendChild(bars);
    wrap.appendChild(el("p", "kx-d-note", `Estimate: ${GROWTH_HOW}.`));
    return wrap;
  }

  function backButton() {
    const b = el("button", "kx-d-back");
    b.type = "button";
    b.dataset.testid = "detail-back";
    b.appendChild(icon("back"));
    b.appendChild(document.createTextNode("Sessions"));
    b.addEventListener("click", () => setOpen(null));
    return b;
  }

  /** The view of one session, top to bottom: top bar, header, meta line, the sentence, curve and where the context went (side by side from 620 px), facts. */
  function detailFor(session) {
    const root = zoned(el("article"), session.zone);
    root.dataset.session = session.sessionId;
    const top = el("div", "kx-d-top");
    top.appendChild(backButton());
    if (session.busy) {
      const badge = el("span", "kx-badge");
      badge.dataset.testid = "detail-busy";
      badge.appendChild(icon("zap"));
      badge.appendChild(document.createTextNode("busy"));
      top.appendChild(badge);
    }
    const esc = el("span", "kx-d-esc", "Esc");
    esc.title = "Escape returns to the list";
    esc.setAttribute("aria-hidden", "true");
    top.appendChild(esc);
    root.appendChild(top);
    const head = el("div", "kx-d-head");
    const dot = el("span", "kx-dot" + (session.busy ? " kx-pulse" : ""));
    dot.title = `Zone: ${ZONE_NAME[session.zone] || "unknown"}`;
    head.appendChild(dot);
    const h = titled(el("h1"), session);
    h.dataset.testid = "detail-title";
    head.appendChild(h);
    const count = el("div", "kx-d-count");
    const n = zoned(el("div", "kx-num", countText(session)), session.zone);
    n.dataset.testid = "detail-tokens";
    n.setAttribute("aria-label", countLabel(session));
    count.appendChild(n);
    if (session.turns || ZONE_NAME[session.zone]) count.appendChild(el("div", "kx-d-zone", ZONE_NAME[session.zone] || "unknown"));
    head.appendChild(count);
    root.appendChild(head);
    const meta = el("div", "kx-d-meta");
    meta.dataset.testid = "detail-meta";
    const add = (name, text) => { const s = el("span"); s.appendChild(icon(name)); s.appendChild(document.createTextNode(text)); meta.appendChild(s); return s; };
    add("folder", session.project || "unknown").title = session.cwd || "";
    if (session.turns) { // before the first turn the sentence and the curve say "no turns yet"
      add("cpu", (session.modelShort || "unknown") + (session.effort ? ` · ${session.effort}` : ""));
      add("repeat", plural(session.turns, "turn", "turns"));
    }
    add("play", startText(session));
    if (session.turns) add("clock", sinceText(session.sinceMs));
    root.appendChild(meta);
    if (session.summary) {
      const sum = el("p", "kx-d-sum", session.summary); // composed by the core (core.cjs summaryText): facts, no advice
      sum.dataset.testid = "detail-summary";
      root.appendChild(sum);
    }
    const pair = el("div", "kx-d-pair");
    pair.appendChild(detailCurve(session));
    pair.appendChild(detailGrowth(session));
    root.appendChild(pair);
    root.appendChild(detailFacts(session));
    return root;
  }

  /**
   * The open session drawn from the last list, with every turn from the host's detail when it has come, or
   * "gone" when the registry no longer has it.
   */
  function drawDetail() {
    if (!openId || !lastData) return; // without a list yet, the first one draws it
    const listed = allSessions(lastData).find((s) => s.sessionId === openId);
    const session = listed && detailAnswer && detailAnswer.sessionId === openId ? { ...listed, ...detailAnswer.detail } : listed;
    const active = document.activeElement;
    const focused = !focusBack && active && detailEl.contains(active) ? active.dataset.testid : null;
    redrawing = true;
    detailEl.textContent = "";
    redrawing = false;
    if (session) detailEl.appendChild(detailFor(session));
    else {
      turnShown = null;
      const gone = el("div");
      gone.appendChild(backButton());
      const p = el("p", "kx-message", "That session is gone from the registry.");
      p.dataset.testid = "detail-gone";
      gone.appendChild(p);
      detailEl.appendChild(gone);
    }
    const target = focusBack ? detailEl.querySelector('[data-testid="detail-back"]') : focused ? detailEl.querySelector(`[data-testid="${focused}"]`) : null;
    focusBack = false;
    if (target) target.focus({ preventScroll: true });
  }

  const scroller = () => document.scrollingElement || document.documentElement;
  /** The list or the detail on screen; the list keeps being drawn behind the detail, so it is current on the way back. */
  function showMode() {
    for (const e of [headerEl, controlsEl, listEl]) e.hidden = !!openId;
    detailEl.hidden = !openId;
    if (!openId) detailEl.textContent = "";
  }

  /** Opens a session (`id`) or returns to the list (null), and remembers it: webview state in VS Code, the hash elsewhere. */
  function setOpen(id, { fromHash = false } = {}) {
    const next = id || null;
    if (next === openId) return;
    const closing = openId;
    if (next && !closing) listScroll = scroller().scrollTop;
    openId = next;
    turnShown = null;
    detailAnswer = null; // the answer for another session, or none
    if (vscode) store.set("open", openId);
    else if (!fromHash) history.replaceState(null, "", openId ? `#${encodeURIComponent(openId)}` : location.pathname + location.search);
    showMode();
    if (openId) {
      focusBack = true;
      scroller().scrollTop = 0;
      drawDetail();
      requestDetail();
      return;
    }
    scroller().scrollTop = listScroll;
    const row = closing && [...listEl.querySelectorAll(".kx-session[tabindex]")].find((r) => r.dataset.session === closing);
    if (row) row.focus({ preventScroll: true });
  }

  listEl.addEventListener("click", (e) => {
    const row = e.target.closest(".kx-session[tabindex]");
    if (row && row.dataset.session) setOpen(row.dataset.session);
  });
  listEl.addEventListener("keydown", (e) => {
    if ((e.key !== "Enter" && e.key !== " ") || !e.target.matches(".kx-session[tabindex]")) return;
    e.preventDefault();
    setOpen(e.target.dataset.session);
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && openId) { e.preventDefault(); setOpen(null); }
  });

  sortEl.addEventListener("change", () => { view.sort = SORTS.includes(sortEl.value) ? sortEl.value : "last"; saveView(); });
  hotEl.addEventListener("click", () => { view.hotOnly = !view.hotOnly; saveView(); });
  resetEl.addEventListener("click", () => { view = { ...VIEW_DEFAULT, hiddenModels: [] }; saveView(); });

  function renderMeter(zoneCounts) {
    const counts = ZONES.map((z) => [z, Number.isFinite(zoneCounts[z]) ? zoneCounts[z] : 0]);
    const known = counts.reduce((sum, [, n]) => sum + n, 0);
    meterBarEl.textContent = "";
    meterLegEl.textContent = "";
    meterBarEl.setAttribute("aria-label", known ? counts.map(([z, n]) => `${n} ${ZONE_NAME[z]}`).join(", ") : "no sessions with a known zone");
    for (const [z, n] of counts) {
      const seg = zoned(el("span"), z);
      seg.style.width = known ? `${pct(n / known)}%` : "0";
      meterBarEl.appendChild(seg);
      const item = zoned(el("span"), z);
      const b = el("b", "", String(n));
      b.dataset.testid = `zone-${z}`;
      item.appendChild(b);
      item.appendChild(document.createTextNode(` ${ZONE_NAME[z]}`));
      item.title = `${n} in the ${ZONE_NAME[z]} zone`;
      meterLegEl.appendChild(item);
    }
  }

  // ── Refresh: the button asks the host for a full read; the icon spins until the next list arrives,
  // then "updated 12:04:31" shows for a few seconds (the only feedback under prefers-reduced-motion) ──
  const REFRESHED_MS = 4000;
  let refreshPending = false, refreshedTimer = null;
  function refreshDone(data) {
    // only the list of the full read counts: a dev server has the stream too, and a tick landing before
    // the full response must not take the receipt (both hosts echo `full` in the payload)
    if (!refreshPending || !(data && data.full === true)) return;
    refreshPending = false;
    refreshEl.removeAttribute("aria-busy");
    const at = new Date(data && data.generatedAt ? data.generatedAt : Date.now());
    refreshedEl.textContent = `updated ${Number.isFinite(at.getTime()) ? at.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) : "now"}`;
    refreshedEl.hidden = false;
    clearTimeout(refreshedTimer);
    refreshedTimer = setTimeout(() => { refreshedEl.hidden = true; }, REFRESHED_MS);
  }

  /** A full read that failed: the list stays as it is, the error goes to the strip above it, the button rests. */
  function refreshFailed(message) {
    refreshPending = false;
    refreshEl.removeAttribute("aria-busy");
    errorsEl.appendChild(el("div", "kx-error", `Refresh failed: ${message}`));
    errorsEl.hidden = false;
  }

  function render(data) {
    lastData = data;
    refreshDone(data);
    drawDetail();
    requestDetail(); // the new list's turns, all of them, for the open session
    countEl.textContent = String(data.count || 0);
    renderMeter(data.zoneCounts || {});
    const cacheCounts = data.cacheCounts || {};
    cacheWarmEl.textContent = String(Number.isFinite(cacheCounts.warm) ? cacheCounts.warm : 0);
    cacheColdEl.textContent = String(Number.isFinite(cacheCounts.cold) ? cacheCounts.cold : 0);
    startMedianEl.hidden = !Number.isFinite(data.baselineMedian);
    if (!startMedianEl.hidden) {
      startMedianEl.firstChild.textContent = tokensText(data.baselineMedian);
      const n = data.baselineSessions;
      startMedianEl.title = `Start cost: the median first turn of the ${n === 1 ? "session" : `${n} sessions`} listed here that began fresh (not after a compaction). It is the fixed load (CLAUDE.md, memory, skill and tool listings) plus the first message, so a long first prompt raises it`;
    }
    const abandoned = Number.isFinite(data.abandonedCount) ? data.abandonedCount : 0;
    abandonedEl.hidden = !abandoned;
    abandonedEl.firstChild.textContent = String(abandoned);
    allEl.checked = !!data.all;
    errorsEl.textContent = "";
    errorsEl.hidden = !(data.errors && data.errors.length);
    if (!errorsEl.hidden) for (const f of data.errors) errorsEl.appendChild(el("div", "kx-error", f));
    const everyone = allSessions(data);
    renderControls(everyone);
    const shown = everyone.filter(passes).length;
    showingEl.hidden = shown === everyone.length;
    showingEl.textContent = `showing ${shown} of ${everyone.length}`;
    // the bar's width transition needs the fill to start where the previous render left it: the previous
    // widths are kept per session, the new rows start there, and after a forced layout they move
    const previous = new Map();
    for (const row of listEl.querySelectorAll(".kx-session")) {
      const fill = row.querySelector(".kx-fill");
      if (fill) previous.set(row.dataset.session, fill.style.getPropertyValue("--p"));
    }
    listEl.textContent = "";
    if (!data.count) { listEl.appendChild(el("p", "kx-message", "No live Claude sessions")); return; }
    if (data.groups) {
      for (const g of data.groups) {
        const project = g.project || "unknown";
        const heading = groupHeading(project, g.sessions.length, "folder", "kx-project", `project:${project}`);
        listEl.appendChild(heading);
        const rows = rowsFor(heading, `project:${project}`);
        if (!rows) continue;
        rows.appendChild(groupsFor(g.sessions, project));
        listEl.appendChild(rows);
      }
    } else {
      listEl.appendChild(groupsFor(data.sessions));
    }
    const moving = [];
    for (const row of listEl.querySelectorAll(".kx-session")) {
      const fill = row.querySelector(".kx-fill");
      const from = previous.get(row.dataset.session);
      if (!fill || from === undefined || from === fill.style.getPropertyValue("--p")) continue;
      moving.push([fill, fill.style.getPropertyValue("--p")]);
      fill.style.setProperty("--p", from);
    }
    if (moving.length) {
      void listEl.offsetWidth; // lay out once at the previous widths, so the change below transitions
      for (const [fill, to] of moving) fill.style.setProperty("--p", to);
    }
  }

  // ── Adapter: VS Code messages when the webview API exists, else a dev server hosting this file ──
  refreshEl.appendChild(icon("refresh"));
  function requestRefresh(ask) {
    if (refreshPending) return;
    refreshPending = true;
    refreshEl.setAttribute("aria-busy", "true");
    ask();
  }
  // the session open when the panel was last shown (VS Code) or named in the address (a dev server)
  const hashId = () => { try { return decodeURIComponent(location.hash.slice(1)) || null; } catch { return null; } };
  const remembered = vscode ? store.get("open") : hashId();
  if (typeof remembered === "string" && remembered) { openId = remembered; focusBack = true; showMode(); }
  if (vscode) {
    window.addEventListener("message", (e) => {
      if (e.data && e.data.type === "sessions") render(e.data);
      if (e.data && e.data.type === "detail") onDetail(e.data);
    });
    askDetail = (id) => vscode.postMessage({ type: "detail", sessionId: id });
    allEl.addEventListener("change", () => vscode.postMessage({ type: "scope", all: allEl.checked }));
    refreshEl.addEventListener("click", () => requestRefresh(() => vscode.postMessage({ type: "refresh" })));
    vscode.postMessage({ type: "ready" });
  } else {
    // A dev server serves its own repo only: no project toggle. The list is fetched once from
    // /claude-context/api/sessions, then the server-sent events stream /claude-context/api/stream pushes
    // every change as a "sessions" event. When the stream drops (the server restarted or stopped) the
    // stream is closed and the page says so with "Try again"; no silent reconnects, so what the page
    // shows is always either live or marked as lost.
    allEl.parentElement.hidden = true;
    window.addEventListener("hashchange", () => setOpen(hashId(), { fromHash: true }));
    let stream = null;
    // every turn of the open session from /claude-context/api/detail; only the latest request's answer is drawn
    let detailAsked = 0;
    askDetail = (id) => {
      const n = ++detailAsked;
      fetch(`/claude-context/api/detail?session=${encodeURIComponent(id)}`, { cache: "no-store" })
        .then((response) => (response.ok ? response.json() : null))
        .then((answer) => { if (n === detailAsked) onDetail(answer); })
        .catch(() => { /* a host without the endpoint: the list's last 200 turns stay */ });
    };

    function lost() {
      if (stream) stream.close();
      stream = null;
      contactEl.hidden = false;
    }

    /** The list once; with `full`, the server forgets its parsed state and reads every transcript again (the refresh button). */
    async function fetchList({ full = false } = {}) {
      const response = await fetch(`/claude-context/api/sessions${full ? "?full=1" : ""}`, { cache: "no-store" });
      // the dev server's own errors are JSON with error; anything else (a generic 404 page) is just the status
      const data = /json/.test(response.headers.get("content-type") || "") ? await response.json() : null;
      if (!response.ok) throw new Error((data && data.error) || `the dev server answered ${response.status}`);
      render(data);
    }

    function connect() {
      stream = new EventSource("/claude-context/api/stream");
      stream.addEventListener("sessions", (e) => {
        contactEl.hidden = true;
        try { render(JSON.parse(e.data)); } catch { /* an incomplete event; the next one draws */ }
      });
      stream.onerror = lost;
    }

    async function start() {
      lost();
      contactEl.hidden = true;
      try { await fetchList(); } catch (e) {
        render({ count: 0, sessions: [], errors: [String(e && e.message || e)] });
        lost();
        return;
      }
      connect();
    }

    contactEl.querySelector("button").addEventListener("click", start);
    refreshEl.addEventListener("click", () => requestRefresh(() => fetchList({ full: true }).catch((e) => refreshFailed(String(e && e.message || e)))));
    start();
  }
})();
</script>
</body>
</html>
